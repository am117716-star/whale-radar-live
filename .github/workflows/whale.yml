name: whale-radar-live
on:
  schedule:
    - cron: "*/5 13-21 * * 1-5"   # كل 5 دقايق وقت جلسة السوق الأمريكي (UTC) — السكربت نفسه يتأكد من ساعات السوق بدقة
  workflow_dispatch:
  push:
    paths-ignore:
      - "state.json"

permissions:
  contents: write

concurrency:
  group: whale-radar
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -q yfinance pandas numpy

      - name: Scan
        env:
          TEST: ${{ github.event_name != 'schedule' && '1' || '0' }}
        run: python live_whale.py

      - name: Save state
        run: |
          git config user.name "whale-bot"
          git config user.email "whale-bot@users.noreply.github.com"
          git add state.json 2>/dev/null || true
          git diff --cached --quiet || { git commit -m "state update"; git push; }
