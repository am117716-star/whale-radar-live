name: whale-radar-live
on:
  schedule:
    # كل تشغيلة تلفّ كل 5 دقايق من وقت بدايتها حتى الإقفال (20:05 UTC) أو حد GitHub (345 دقيقة) — أيهما أقرب.
    # الجدولة الاحتياطية كل نص ساعة تصلّح نفسها: لو تخطّى GitHub أي وحدة، اللي بعدها تكمل لحالها.
    - cron: "20 13 * * 1-5"   # 16:20 بتوقيت السعودية (قبل الافتتاح)
    - cron: "50 16 * * 1-5"   # 19:50 بتوقيت السعودية
    - cron: "5,35 14-19 * * 1-5"   # احتياط ذاتي الإصلاح كل نص ساعة
  workflow_dispatch:
    inputs:
      loop:
        description: "شغّل حلقة الجلسة كاملة (كل 5 دقايق حتى الإقفال) بدل فحص اختبار واحد"
        type: boolean
        default: false
      evaluate:
        description: "شغّل تقييم نتائج اليوم فقط (بعد الإقفال)"
        type: boolean
        default: false
  push:
    paths-ignore:
      - "state.json"
      - "alerts.jsonl"
      - "results.csv"
      - "daily_cache.json"

permissions:
  contents: write

concurrency:
  group: whale-radar
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -q yfinance pandas numpy

      - name: Scan (test / evaluate / 5-minute session loop)
        env:
          MODE: ${{ github.event_name == 'schedule' && 'loop' || (inputs.evaluate == true && 'evaluate' || (inputs.loop == true && 'loop' || 'test')) }}
        run: |
          git config user.name "whale-bot"
          git config user.email "whale-bot@users.noreply.github.com"
          save_state() {
            # git add يفشل كله لو ملف واحد ناقص — لذلك نضيف الموجود فقط
            for f in state.json alerts.jsonl results.csv daily_cache.json; do
              [ -f "$f" ] && git add "$f"
            done
            if ! git diff --cached --quiet; then
              git commit -q -m "state update [skip ci]"
              git pull --rebase -q origin main || true
              git push -q origin HEAD:main || echo "push failed"
            fi
          }
          sync_state() {
            # يجلب آخر حالة من المستودع (تنبيهات تشغيلة سابقة بنفس اليوم)
            git pull --rebase -q origin main || true
          }
          echo "MODE=$MODE"
          if [ "$MODE" = "test" ]; then
            TEST=1 python live_whale.py || true
            exit 0
          fi
          if [ "$MODE" = "evaluate" ]; then
            sync_state
            python live_whale.py --evaluate || true
            save_state
            exit 0
          fi
          # حلقة الجلسة: من الآن حتى min(البداية+345 دقيقة، 20:05 UTC)
          START_MIN=$((10#$(date -u +%H) * 60 + 10#$(date -u +%M)))
          CLOSE_MIN=$((20 * 60 + 5))
          END_MIN=$((START_MIN + 345)); [ "$END_MIN" -gt "$CLOSE_MIN" ] && END_MIN=$CLOSE_MIN
          echo "session loop: start $START_MIN → end $END_MIN (minutes UTC), every 5 min"
          sync_state
          while :; do
            NOW_MIN=$((10#$(date -u +%H) * 60 + 10#$(date -u +%M)))
            [ "$NOW_MIN" -ge "$END_MIN" ] && break
            python live_whale.py || true
            save_state
            sleep 300
          done
          echo "session loop finished"
          # التقييم بعد الإقفال — فقط التشغيلة اللي وصلت للإقفال، ومرة وحدة باليوم
          if [ "$END_MIN" -eq "$CLOSE_MIN" ]; then
            sync_state
            TODAY=$(date -u +%F)
            if ! grep -q "^$TODAY," results.csv 2>/dev/null; then
              python live_whale.py --evaluate || true
              save_state
            fi
          fi
