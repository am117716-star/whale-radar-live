name: whale-radar-live
on:
  schedule:
    # الجلسة الأولى تغطي أغلب السوق (13:20→19:00 UTC، قريب من حد GitHub 6 ساعات) والثانية تكمل للإغلاق (→20:05) — كل جلسة تلفّ داخليًا كل 5 دقايق.
    # (جدولة */5 ما تنفع: GitHub يؤخّرها ساعات ويتخطّاها — لذلك حلقة واحدة طويلة أوثق بكثير)
    - cron: "20 13 * * 1-5"   # 16:20 بتوقيت السعودية → تغطي الافتتاح حتى 16:55 UTC
    - cron: "50 16 * * 1-5"   # 19:50 بتوقيت السعودية → تغطي حتى الإغلاق 20:05 UTC
    - cron: "5,35 14-19 * * 1-5"   # احتياط ذاتي الإصلاح كل نص ساعة: لو تخطّى GitHub أي جدولة، اللي بعدها تكمل لحالها
  workflow_dispatch:
    inputs:
      loop:
        description: "شغّل حلقة الجلسة كاملة (كل 5 دقايق حتى الإغلاق) بدل فحص اختبار واحد"
        type: boolean
        default: false
  push:
    paths-ignore:
      - "state.json"

permissions:
  contents: write

concurrency:
  group: whale-radar
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -q yfinance pandas numpy

      - name: Scan (single test, or 5-minute session loop)
        env:
          TEST: ${{ (github.event_name == 'schedule' || inputs.loop == true) && '0' || '1' }}
        run: |
          git config user.name "whale-bot"
          git config user.email "whale-bot@users.noreply.github.com"
          save_state() {
            git add state.json 2>/dev/null || true
            if ! git diff --cached --quiet; then
              git commit -q -m "state update"
              git pull --rebase -q origin main || true
              git push -q || true
            fi
          }
          if [ "$TEST" = "1" ]; then
            python live_whale.py || true
            save_state
            exit 0
          fi
          # نهاية الحلقة: أي جلسة تبدأ قبل 19:00 UTC تنتهي 19:00، وما بعدها ينتهي 20:05 UTC (بعد الإغلاق بشوي)
          H=$(date -u +%H | sed 's/^0//')
          if [ "$H" -lt 19 ]; then END=1900; else END=2005; fi
          echo "session loop until $END UTC (every 5 min)"
          while :; do
            NOW=$(date -u +%H%M | sed 's/^0*//'); NOW=${NOW:-0}
            [ "$NOW" -ge "$END" ] && break
            python live_whale.py || true
            save_state
            sleep 300
          done
          echo "session loop finished"
