name: whale-grid
on:
  workflow_dispatch:
  push:
    paths:
      - "backtest_grid.py"
      - ".github/workflows/grid.yml"

permissions:
  contents: write

concurrency:
  group: whale-grid
  cancel-in-progress: true

jobs:
  grid:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -q yfinance pandas numpy

      - name: Grid experiment (light-filter whale events × target/stop grid)
        run: python backtest_grid.py

      - name: Save results to repo
        if: always()
        run: |
          git config user.name "whale-bot"
          git config user.email "whale-bot@users.noreply.github.com"
          for f in grid_results.csv grid_summary.txt; do [ -f "$f" ] && git add "$f"; done
          if git diff --cached --quiet; then echo "nothing to save"; exit 0; fi
          git commit -q -m "grid results [skip ci]"
          for i in 1 2 3 4 5; do
            git pull --rebase -q origin main && git push -q origin HEAD:main && echo "pushed" && break
            echo "push retry $i"; sleep 15
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grid
          path: |
            grid_results.csv
            grid_summary.txt
